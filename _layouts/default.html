<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} — Alfiandi{% else %}Alfiandi — Catatan dan Pemikiran{% endif %}</title>
<meta name="description" content="Alfiandi — blog pribadi tentang pemikiran, kehidupan, opini, dan berbagai catatan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf6ee; --ink:#221e18; --muted:#6b5f4d; --line:#e2d5bd;
  --accent:#b5502e; --accent2:#7a8c5f; --card:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.7;}
a{color:inherit;text-decoration:none;}
h1,h2,h3{font-family:'Playfair Display',serif;}

/* HEADER */
.top-bar{background:var(--ink);color:#f2e9d8;text-align:center;padding:8px;font-size:11px;letter-spacing:3px;text-transform:uppercase;}
header{max-width:1160px;margin:auto;padding:34px 24px 0;}
.brand{text-align:center;padding:20px 10px 28px;}
.brand h1{font-size:clamp(46px,7vw,78px);font-weight:700;letter-spacing:-2px;}
.brand h1 a{background:linear-gradient(90deg,var(--accent),#c97a4a);-webkit-background-clip:text;background-clip:text;color:transparent;}
.brand p{margin-top:10px;font-style:italic;color:var(--muted);font-size:16px;}
nav{position:sticky;top:0;z-index:10;background:var(--bg);border-top:1px solid var(--line);border-bottom:2px solid var(--ink);display:flex;justify-content:center;flex-wrap:wrap;gap:30px;padding:14px 12px;font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;}
nav a{padding:4px 2px;border-bottom:2px solid transparent;transition:.2s;}
nav a:hover{border-color:var(--accent);color:var(--accent);}

/* MAIN */
main{max-width:1160px;margin:auto;padding:50px 24px;}
.section-title{display:flex;align-items:center;gap:15px;margin-bottom:28px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--muted);}
.section-title::after{content:"";height:1px;background:var(--line);flex:1;}

/* FEATURED */
.featured{display:grid;grid-template-columns:1.3fr 1fr;gap:40px;padding-bottom:50px;border-bottom:1px solid var(--line);margin-bottom:50px;}
.featured-image{min-height:420px;border-radius:14px;background:linear-gradient(rgba(20,15,10,.1),rgba(20,15,10,.55)),var(--img) center/cover;display:flex;align-items:flex-end;padding:22px;box-shadow:0 18px 40px -18px rgba(0,0,0,.4);}
.badge{background:var(--accent);color:#fff;padding:6px 14px;border-radius:999px;font-family:'Inter';font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:600;}
.featured-content{display:flex;flex-direction:column;justify-content:center;}
.category{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:12px;}
.featured-content h2{font-size:clamp(32px,4vw,50px);font-weight:700;line-height:1.1;margin-bottom:18px;}
.featured-content h2 a:hover{color:var(--accent);}
.excerpt{font-size:17px;color:#4a4234;margin-bottom:22px;}
.meta{font-size:11.5px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;}
.read-more{margin-top:22px;display:inline-flex;align-items:center;gap:6px;width:fit-content;color:var(--accent);font-weight:600;border-bottom:2px solid var(--accent);padding-bottom:2px;}

/* GRID ARTIKEL */
.article-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;}
.article{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 8px 24px -14px rgba(0,0,0,.18);transition:transform .25s, box-shadow .25s;}
.article:hover{transform:translateY(-5px);box-shadow:0 16px 32px -14px rgba(0,0,0,.28);}
.article-image{height:190px;background-size:cover;background-position:center;background-color:#d8ccb3;}
.article-body{padding:20px 20px 24px;}
.article .category{font-size:10.5px;margin-bottom:8px;}
.article h3{font-size:22px;font-weight:700;line-height:1.25;margin-bottom:10px;}
.article h3 a:hover{color:var(--accent);}
.article p{color:#5d5548;font-size:14.5px;margin-bottom:12px;}

/* POST */
.post-body{max-width:720px;margin:auto;font-size:18px;}
.post-body img{max-width:100%;border-radius:12px;margin:24px 0;}
.post-title{font-size:clamp(30px,5vw,48px);font-weight:700;margin-bottom:14px;line-height:1.15;}

/* ABOUT */
.about{text-align:center;background:var(--ink);color:#f2e9d8;padding:60px 25px;margin-top:65px;border-radius:18px;}
.about h2{font-size:32px;margin-bottom:14px;}
.about p{max-width:620px;margin:auto;color:#cbbfa4;font-size:16px;}

footer{max-width:1160px;margin:auto;padding:40px 24px;text-align:center;font-size:13px;color:var(--muted);}
.footer-title{font-family:'Playfair Display',serif;font-size:24px;color:var(--ink);margin-bottom:8px;}

@media (max-width:800px){
  .featured{grid-template-columns:1fr;gap:22px;}
  .featured-image{min-height:280px;}
  .article-grid{grid-template-columns:1fr;}
  nav{gap:16px;}
}
</style>
</head>
<body>
<div class="top-bar">Edisi {{ site.time | date: "%A" }} · {{ site.time | date: "%-d %B %Y" }}</div>
<header>
  <div class="brand">
    <h1><a href="{{ '/' | relative_url }}">Alfiandi</a></h1>
    <p>Catatan tentang pemikiran, kehidupan, dan dunia di sekitar kita.</p>
  </div>
</header>
<nav>
  <a href="{{ '/' | relative_url }}">Beranda</a>
  <a href="{{ '/tulisan.html' | relative_url }}">Tulisan</a>
  <a href="{{ '/opini.html' | relative_url }}">Opini</a>
  <a href="{{ '/pemikiran.html' | relative_url }}">Pemikiran</a>
  <a href="{{ '/tentang.html' | relative_url }}">Tentang Saya</a>
</nav>
<main>{{ content }}</main>
<footer>
  <div class="footer-title">Alfiandi</div>
  <p>© {{ site.time | date: "%Y" }} Alfiandi · Tulisan dan pemikiran pribadi.</p>
</footer>
</body>
</html>
